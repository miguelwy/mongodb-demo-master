<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vector Search Demo</title>
  <link rel="icon" type="image/svg+xml" href="/img/mongodb-logomark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/mongo.css" />
  <link rel="stylesheet" href="demo.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<!-- All user-facing copy lives in i18n.js; elements here only carry data-i18n keys. -->
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="logo" role="img" aria-label="MongoDB"></span></a>
    <span class="crumb">Vector Search &amp; Automated Embedding</span>
    <span class="spacer"></span>
    <span class="pill" id="conn"><span class="dot pulse"></span></span>
    <button class="icon-btn" id="present-toggle" data-i18n="present" data-i18n-title="presentTitle"></button>
    <button class="icon-btn" data-lang-toggle></button>
    <button class="icon-btn" data-theme-toggle data-i18n-title="theme">◐</button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <ol id="step-nav"></ol>
    </aside>

    <main class="steps">

      <!-- cover ─────────────────────────────────────── -->
      <section class="step" id="cover">
        <svg class="cover-field" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <g class="edges">
            <line x1="860" y1="150" x2="980" y2="250"/><line x1="980" y1="250" x2="900" y2="360"/><line x1="980" y1="250" x2="1100" y2="200"/>
            <line x1="900" y1="360" x2="1040" y2="430"/><line x1="1040" y1="430" x2="1120" y2="340"/><line x1="900" y1="360" x2="800" y2="470"/>
            <line x1="1040" y1="430" x2="960" y2="560"/><line x1="800" y1="470" x2="960" y2="560"/><line x1="1100" y1="200" x2="1120" y2="340"/>
          </g>
          <g class="nodes">
            <circle cx="860" cy="150" r="5"/><circle cx="1100" cy="200" r="4"/><circle cx="1120" cy="340" r="6"/>
            <circle cx="800" cy="470" r="4"/><circle cx="960" cy="560" r="5"/><circle cx="1040" cy="430" r="5"/>
            <circle class="hot" cx="980" cy="250" r="9"/><circle class="hot" cx="900" cy="360" r="7"/>
          </g>
        </svg>
        <div class="cover-body">
          <span class="logo cover-logo" role="img" aria-label="MongoDB"></span>
          <div class="eyebrow">Atlas</div>
          <h1>Vector Search &amp; <em>Automated Embedding</em></h1>
          <p class="lead" data-i18n="cover.lead"></p>
          <button class="btn primary" id="cover-start" data-i18n="cover.start"></button>
        </div>
      </section>

      <!-- intro ─────────────────────────────────────── -->
      <section class="step" id="intro">
        <header>
          <div class="eyebrow">Vector Search · Automated Embedding</div>
          <h2 data-i18n="intro.title"></h2>
          <p class="lead" data-i18n="intro.lead"></p>
        </header>
        <div class="vs">
          <div class="card">
            <h3 data-i18n="intro.keywordTitle"></h3>
            <div class="example-q" data-i18n="intro.query"></div>
            <p class="muted" data-i18n="intro.keywordBody"></p>
            <span class="tag warn" data-i18n="intro.keywordResult"></span>
          </div>
          <div class="card">
            <h3 data-i18n="intro.semanticTitle"></h3>
            <div class="example-q" data-i18n="intro.query"></div>
            <p class="muted" data-i18n="intro.semanticBody"></p>
            <span class="tag" data-i18n="intro.semanticResult"></span>
          </div>
        </div>
        <h3 class="section-title" data-i18n="intro.agendaTitle"></h3>
        <div class="grid three" data-i18n="intro.agenda"></div>
      </section>

      <!-- concepts ──────────────────────────────────── -->
      <section class="step" id="concepts">
        <header>
          <div class="eyebrow" data-i18n="eyebrow.concept"></div>
          <h2 data-i18n="concepts.title"></h2>
          <p class="lead" data-i18n="concepts.lead"></p>
        </header>

        <h3 class="section-title" data-i18n="concepts.embeddingTitle"></h3>
        <div class="card">
          <svg class="diagram" viewBox="0 0 940 120" role="img" data-i18n-aria-label="concepts.embeddingTitle">
            <defs><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ED64"/></marker></defs>
            <g class="actor"><rect x="10" y="20" width="290" height="76" rx="10"/><text x="155" y="52" data-i18n="concepts.sample"></text><text class="sub" x="155" y="76" data-i18n="concepts.sampleSub"></text></g>
            <line class="msg w" x1="304" y1="58" x2="366" y2="58" marker-end="url(#ac)"/>
            <g class="actor hl"><rect x="370" y="20" width="200" height="76" rx="10"/><text x="470" y="52" data-i18n="concepts.model"></text><text class="sub" x="470" y="76">voyage-4</text></g>
            <line class="msg w" x1="574" y1="58" x2="636" y2="58" marker-end="url(#ac)"/>
            <g class="actor"><rect x="640" y="20" width="290" height="76" rx="10"/><text x="785" y="52">[0.12, -0.48, 0.91, …]</text><text class="sub" x="785" y="76" data-i18n="concepts.vectorSub"></text></g>
          </svg>
        </div>

        <h3 class="section-title" data-i18n="concepts.spaceTitle"></h3>
        <div class="card">
          <svg class="diagram" viewBox="0 0 940 340" role="img" data-i18n-aria-label="concepts.spaceTitle">
            <ellipse class="cluster" cx="250" cy="165" rx="205" ry="115"/>
            <ellipse class="cluster" cx="700" cy="85" rx="195" ry="68"/>
            <ellipse class="cluster" cx="700" cy="255" rx="195" ry="68"/>
            <text class="cap" x="250" y="72" data-i18n="concepts.c1"></text>
            <text class="cap" x="700" y="42" data-i18n="concepts.c2"></text>
            <text class="cap" x="700" y="214" data-i18n="concepts.c3"></text>
            <line class="near" x1="240" y1="175" x2="150" y2="115"/><line class="near" x1="240" y1="175" x2="165" y2="240"/><line class="near" x1="240" y1="175" x2="345" y2="125"/>
            <circle class="pt" cx="150" cy="115" r="6"/><text class="plbl" x="150" y="102">Andes Flask 1L</text>
            <circle class="pt" cx="165" cy="240" r="6"/><text class="plbl" x="165" y="262">Pour-Over Set</text>
            <circle class="pt" cx="345" cy="125" r="6"/><text class="plbl" x="345" y="112">Burr Grinder 40</text>
            <circle class="pt" cx="600" cy="85" r="6"/><text class="plbl" x="600" y="107">Polar Mummy -10</text>
            <circle class="pt" cx="790" cy="90" r="6"/><text class="plbl" x="790" y="112">Ridgeline 2P</text>
            <circle class="pt" cx="610" cy="265" r="6"/><text class="plbl" x="610" y="287">ErgoFlow Chair</text>
            <circle class="pt" cx="790" cy="255" r="6"/><text class="plbl" x="790" y="277">Quietude ANC</text>
            <circle class="q" cx="240" cy="175" r="9"/><text class="qlbl" x="240" y="205" data-i18n="concepts.queryPoint"></text>
          </svg>
          <small data-i18n="concepts.spaceNote"></small>
        </div>

        <h3 class="section-title" data-i18n="concepts.termsTitle"></h3>
        <div class="grid three" data-i18n="concepts.terms"></div>
      </section>

      <!-- how ───────────────────────────────────────── -->
      <section class="step" id="how">
        <header>
          <div class="eyebrow" data-i18n="eyebrow.concept"></div>
          <h2 data-i18n="how.title"></h2>
          <p class="lead" data-i18n="how.lead"></p>
        </header>
        <div class="card">
          <svg class="diagram" viewBox="0 0 940 440" role="img" aria-label="Automated Embedding sequence diagram">
            <g class="actor"><rect x="30" y="10" width="170" height="56" rx="10"/><text x="115" y="35" data-i18n="diag.app"></text><text class="sub" x="115" y="53" data-i18n="diag.appSub"></text></g>
            <g class="actor"><rect x="270" y="10" width="170" height="56" rx="10"/><text x="355" y="35" data-i18n="diag.cluster"></text><text class="sub" x="355" y="53" data-i18n="diag.clusterSub"></text></g>
            <g class="actor hl"><rect x="510" y="10" width="170" height="56" rx="10"/><text x="595" y="35">Vector Search</text><text class="sub" x="595" y="53" data-i18n="diag.vsSub"></text></g>
            <g class="actor"><rect x="750" y="10" width="170" height="56" rx="10"/><text x="835" y="35">Voyage AI</text><text class="sub" x="835" y="53" data-i18n="diag.voyageSub"></text></g>
            <line class="life" x1="115" y1="66" x2="115" y2="430"/><line class="life" x1="355" y1="66" x2="355" y2="430"/>
            <line class="life" x1="595" y1="66" x2="595" y2="430"/><line class="life" x1="835" y1="66" x2="835" y2="430"/>
            <defs>
              <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ED64"/></marker>
              <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#016BF8"/></marker>
            </defs>
            <text class="lane" x="0" y="94">WRITE PATH</text>
            <text class="lbl" x="235" y="112">insertOne({ description })</text>
            <line class="msg w" x1="117" y1="120" x2="353" y2="120" marker-end="url(#aw)"/>
            <text class="lbl" x="475" y="145" data-i18n="diag.sync"></text>
            <line class="msg w" x1="357" y1="153" x2="593" y2="153" marker-end="url(#aw)"/>
            <text class="lbl" x="715" y="178">embed(document)</text>
            <line class="msg w" x1="597" y1="186" x2="833" y2="186" marker-end="url(#aw)"/>
            <text class="lbl" x="715" y="211" data-i18n="diag.vector"></text>
            <line class="msg w back" x1="833" y1="219" x2="597" y2="219" marker-end="url(#aw)"/>
            <g class="note"><rect x="510" y="232" width="170" height="30" rx="6"/><text x="595" y="251" data-i18n="diag.store"></text></g>
            <text class="lane" x="0" y="292">READ PATH</text>
            <text class="lbl" x="235" y="306">$vectorSearch { query.text }</text>
            <line class="msg r" x1="117" y1="314" x2="353" y2="314" marker-end="url(#ar)"/>
            <line class="msg r" x1="357" y1="314" x2="593" y2="314" marker-end="url(#ar)"/>
            <text class="lbl" x="715" y="338">embed(query)</text>
            <line class="msg r" x1="597" y1="346" x2="833" y2="346" marker-end="url(#ar)"/>
            <line class="msg r back" x1="833" y1="366" x2="597" y2="366" marker-end="url(#ar)"/>
            <g class="note"><rect x="510" y="378" width="170" height="26" rx="6"/><text x="595" y="395" data-i18n="diag.ann"></text></g>
            <text class="lbl" x="355" y="412">top-k + vectorSearchScore</text>
            <line class="msg r back" x1="593" y1="422" x2="117" y2="422" marker-end="url(#ar)"/>
          </svg>
        </div>
        <h3 class="section-title" data-i18n="how.changeTitle"></h3>
        <div class="vs">
          <div class="card bad"><h3 data-i18n="how.diyTitle"></h3><ul data-i18n="how.diyList"></ul></div>
          <div class="card good"><h3 data-i18n="how.autoTitle"></h3><ul data-i18n="how.autoList"></ul></div>
        </div>
      </section>

      <!-- data ──────────────────────────────────────── -->
      <section class="step" id="data">
        <header>
          <div class="eyebrow" data-i18n="eyebrow.practice"></div>
          <h2 data-i18n="s2.title"></h2>
          <p class="lead" data-i18n="s2.lead"></p>
        </header>
        <div class="grid two">
          <div class="stack">
            <div class="card row">
              <div class="stat"><b id="stat-count">–</b><span data-i18n="s2.docs"></span></div>
              <div class="stat" style="margin-left:2rem"><b id="stat-db">–</b><span>namespace</span></div>
            </div>
            <div data-snippet="connect"></div>
          </div>
          <div data-snippet="document"></div>
        </div>
        <h3 class="section-title" data-i18n="s2.collection"></h3>
        <div class="table-wrap"><table id="products-table"><thead data-i18n="s2.thead"></thead><tbody></tbody></table></div>
      </section>

      <!-- 3 ─────────────────────────────────────────── -->
      <section class="step" id="index">
        <header>
          <div class="eyebrow" data-i18n="eyebrow.practice"></div>
          <h2 data-i18n="s3.title"></h2>
          <p class="lead" data-i18n="s3.lead"></p>
        </header>
        <div class="grid two">
          <div data-snippet="createIndex"></div>
          <div class="stack">
            <div class="card stack">
              <h3 data-i18n="s3.live"></h3>
              <div class="row">
                <button class="btn primary" id="create-auto" data-i18n="s3.create"></button>
              </div>
              <div id="index-status"></div>
            </div>
            <div class="card stack">
              <h3 data-i18n="s3.modelTitle"></h3>
              <div class="row">
                <select id="model-select" style="max-width:220px"></select>
                <button class="btn sm" id="model-apply" data-i18n="apply"></button>
              </div>
              <small data-i18n="s3.modelNote"></small>
            </div>
          </div>
        </div>

        <h3 class="section-title" data-i18n="s3.wait"></h3>
        <div data-snippet="waitIndex"></div>
        <div style="margin-top:1rem" data-snippet="changeModel"></div>

        <h3 class="section-title" data-i18n="s3.which"></h3>
        <div class="table-wrap"><table data-i18n="s3.modelTable"></table></div>

        <div class="callout warn" data-i18n="s3.warn"></div>
        <div class="callout tip" data-i18n="s3.tip"></div>
      </section>

      <!-- 4 ─────────────────────────────────────────── -->
      <section class="step" id="search">
        <header>
          <div class="eyebrow" data-i18n="eyebrow.practice"></div>
          <h2 data-i18n="s4.title"></h2>
          <p class="lead" data-i18n="s4.lead"></p>
        </header>
        <div id="search-main"></div>
        <h3 class="section-title" data-i18n="code"></h3>
        <div data-snippet="query"></div>
        <div class="callout tip" data-i18n="s4.tip1"></div>
        <div class="callout tip" data-i18n="s4.tip2"></div>
      </section>

      <!-- 5 ─────────────────────────────────────────── -->
      <section class="step" id="filters">
        <header>
          <div class="eyebrow" data-i18n="eyebrow.practice"></div>
          <h2 data-i18n="s5.title"></h2>
          <p class="lead" data-i18n="s5.lead"></p>
        </header>
        <div id="search-filters"></div>
        <h3 class="section-title" data-i18n="code"></h3>
        <div data-snippet="filters"></div>
        <div class="callout warn" data-i18n="s5.warn"></div>
        <div class="callout" data-i18n="s5.point"></div>
      </section>

      <!-- 6 ─────────────────────────────────────────── -->
      <section class="step" id="sync">
        <header>
          <div class="eyebrow" data-i18n="eyebrow.practice"></div>
          <h2 data-i18n="s6.title"></h2>
          <p class="lead" data-i18n="s6.lead"></p>
        </header>
        <div class="grid two">
          <div class="card stack">
            <h3 data-i18n="s6.insert"></h3>
            <div><label data-i18n="f.name"></label><input type="text" id="sync-name" value="Brew-to-Go" /></div>
            <div><label data-i18n="f.desc"></label><textarea id="sync-desc">Hand-powered portable espresso maker. Pump 18 bars of pressure by hand and pull a rich shot anywhere, no electricity or capsules required.</textarea></div>
            <div class="row">
              <div style="flex:1"><label data-i18n="f.category"></label><select id="sync-cat"></select></div>
              <div style="width:120px"><label data-i18n="f.price"></label><input type="number" id="sync-price" value="349" /></div>
            </div>
            <div><label data-i18n="f.probe"></label><input type="text" id="sync-probe" data-i18n-value="s6.probeDefault" /></div>
            <div class="row">
              <button class="btn primary" id="sync-insert" data-i18n="s6.insertBtn"></button>
            </div>
          </div>
          <div class="card stack">
            <div class="row"><div class="big-timer" id="sync-timer">0.0s</div><small id="sync-state" class="muted" data-i18n="s6.waiting"></small></div>
            <ol class="timeline" id="sync-timeline"></ol>
          </div>
        </div>

        <h3 class="section-title" data-i18n="s6.edit"></h3>
        <div class="card stack">
          <div class="row">
            <div style="flex:1;min-width:220px"><label data-i18n="f.product"></label><select id="edit-product"></select></div>
            <div style="flex:2;min-width:260px"><label data-i18n="f.probe"></label><input type="text" id="edit-probe" data-i18n-value="s6.editProbeDefault" /></div>
          </div>
          <div><label data-i18n="f.newDesc"></label><textarea id="edit-desc">Interactive cat toy with a feather wand and a laser pointer that keeps indoor cats active and entertained.</textarea></div>
          <div class="row"><button class="btn primary" id="edit-apply" data-i18n="s6.editBtn"></button><small data-i18n="s6.editNote"></small></div>
          <ol class="timeline" id="edit-timeline"></ol>
        </div>

        <h3 class="section-title" data-i18n="s6.appCode"></h3>
        <div data-snippet="sync"></div>
        <div class="callout tip" data-i18n="s6.tip"></div>
      </section>

      <!-- 7 ─────────────────────────────────────────── -->
      <section class="step" id="manual">
        <header>
          <div class="eyebrow" data-i18n="eyebrow.practice"></div>
          <h2 data-i18n="s7.title"></h2>
          <p class="lead" data-i18n="s7.lead"></p>
        </header>
        <div data-snippet="diy"></div>
        <div id="manual-live">
          <h3 class="section-title" data-i18n="s7.live"></h3>
          <div class="card stack">
            <div class="row">
              <button class="btn" id="manual-embed" data-i18n="s7.embed"></button>
              <button class="btn" id="manual-index" data-i18n="s7.index"></button>
            </div>
            <div id="manual-info" class="muted"></div>
          </div>
          <div id="compare-manual" style="margin-top:1rem"></div>
        </div>
        <div class="callout tip" data-i18n="s7.tip"></div>
      </section>

      <!-- 8 ─────────────────────────────────────────── -->
      <section class="step" id="hybrid">
        <header>
          <div class="eyebrow" data-i18n="eyebrow.practice"></div>
          <h2 data-i18n="s8.title"></h2>
          <p class="lead" data-i18n="s8.lead"></p>
        </header>
        <div class="card row" style="margin-bottom:1rem">
          <button class="btn" id="text-index" data-i18n="s8.textIndex"></button>
          <span id="text-index-status" class="muted"></span>
        </div>
        <div id="compare-hybrid"></div>
        <h3 class="section-title" data-i18n="code"></h3>
        <div data-snippet="hybrid"></div>
        <div class="callout tip" data-i18n="s8.tip"></div>
      </section>

      <!-- 9 ─────────────────────────────────────────── -->
      <section class="step" id="summary">
        <header>
          <div class="eyebrow" data-i18n="eyebrow.summary"></div>
          <h2 data-i18n="s9.title"></h2>
        </header>
        <div class="grid two">
          <div class="card faq">
            <h3 data-i18n="s9.faqTitle"></h3>
            <div data-i18n="s9.faq"></div>
          </div>
          <div class="card">
            <h3 data-i18n="s9.recapTitle"></h3>
            <ul class="recap" data-i18n="s9.recap"></ul>
          </div>
        </div>
        <h3 class="section-title" data-i18n="s9.docs"></h3>
        <div class="row">
          <a class="btn sm" target="_blank" rel="noopener" href="https://www.mongodb.com/docs/vector-search/crud-embeddings/automated-embedding/">Automated Embedding</a>
          <a class="btn sm" target="_blank" rel="noopener" href="https://www.mongodb.com/docs/vector-search/indexes/vector-search-type/">Index fields</a>
          <a class="btn sm" target="_blank" rel="noopener" href="https://www.mongodb.com/docs/vector-search/query/aggregation-stages/vector-search-stage/">$vectorSearch</a>
          <a class="btn sm" target="_blank" rel="noopener" href="https://www.mongodb.com/docs/manual/reference/operator/aggregation/rankfusion/">$rankFusion</a>
        </div>
      </section>
    </main>
  </div>

  <footer class="stepper">
    <button class="btn sm" id="prev" data-i18n="prev"></button>
    <div class="progress"><div id="progress-bar"></div></div>
    <small id="step-count" class="muted"></small>
    <button class="btn sm primary" id="next" data-i18n="next"></button>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
